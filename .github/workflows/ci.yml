# The site is harnessed like an agent:
#   guardrails (validate) → tests (e2e) → evals (Lighthouse) → preview → human gate → production
# Risk-based approval: a push that only touches copy (content.js, docs) still runs every gate,
# but deploys without waiting for a human. Anything else needs approval on "production".
name: harness

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run validate
      - run: npm run check:csp
      - name: Broken-link check
        uses: lycheeverse/lychee-action@v2
        with:
          # cleanUrls: /resume is resume.html; our own domain is checked as local files, not the
          # live site (a new page would 404 there until this very run deploys it)
          args: --no-progress --root-dir "${{ github.workspace }}" --fallback-extensions html --exclude "linkedin.com" --exclude "russelcarlo.vercel.app" index.html 404.html kiro-harness.html linaw.html resume.html
          fail: true

  tests:
    needs: guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }

  evals:
    needs: guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

  risk:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.classify.outputs.level }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: classify
        # anything unknown (new branch, force-push, empty diff) is high risk
        run: |
          before="${{ github.event.before }}"
          level=high
          if git cat-file -e "$before^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$before" "${{ github.sha }}")
            printf '%s\n' "$files"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(content\.js|[^/]+\.md|docs/.+)$'; then
              level=low
            fi
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "Risk: **$level** ($([ $level = low ] && echo 'content only, auto-deploy' || echo 'needs human approval'))" >> "$GITHUB_STEP_SUMMARY"

  preview:
    needs: [tests, evals]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - run: npm i -g vercel@latest
      - name: Require Vercel secrets
        run: |
          [ -n "${{ secrets.VERCEL_TOKEN }}" ] || { echo "::error::VERCEL_TOKEN secret is missing"; exit 1; }
      - id: deploy
        # assign first so a failed deploy fails the step (echo "$(...)" would swallow it)
        run: |
          url=$(vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - run: echo "Preview → ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} -R ${{ github.repository }} --edit-last --create-if-none --body "🐺 **Preview ready:** ${{ steps.deploy.outputs.url }}

          Passed guardrails, tests, and Lighthouse evals for \`${{ github.event.pull_request.head.sha }}\`."

  production:
    # human in the loop: "production" requires a reviewer; "production-content" (low risk) does not
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [preview, risk]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.risk.outputs.level == 'low' && 'production-content' || 'production' }}
      url: https://russelcarlo.vercel.app
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - run: npm i -g vercel@latest
      - run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
